name: Final index decoder and transition proof
on:
  push:
    branches: [test/ccn-index-decoder-proof]
permissions:
  contents: read
jobs:
  decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: go test -count=1 ./internal/gitobj -run '^(TestInitialPackIndexJournalTransitionHonorsCancellation|TestIndexInput.*)$'
