name: Relevance executable path lint diagnostic

on:
  push:
    branches: [proof/relevance-executable-path-baseline]

permissions:
  contents: read

jobs:
  clean-cache-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: baseline-with-test
            ref: bee03b49ab6ece102be7376ac6c1b2036af44e52
    name: clean-cache-lint-${{ matrix.label }}
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
      - uses: ./.github/actions/setup
      - uses: golangci/golangci-lint-action@v9
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/relevance-lint-${{ matrix.label }}
        with:
          version: v2.15.0
          skip-cache: true
