name: Relevance executable path baseline proof

on:
  push:
    branches: [proof/relevance-executable-path-baseline]

permissions:
  contents: read

jobs:
  baseline-red:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Alternate executable paths in one synthetic repository
        run: ./scripts/test.sh -race -count=1 -v -run '^TestRelevantCachedKeepsExecutablePathsIndependent$' ./notes
  baseline-clean-lint:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: golangci/golangci-lint-action@v9
        env:
          GOLANGCI_LINT_CACHE: ${{ runner.temp }}/relevance-lint-cwd-fixture
        with:
          version: v2.15.0
          skip-cache: true
