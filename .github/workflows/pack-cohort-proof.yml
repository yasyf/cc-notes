name: Pack cohort proof

on:
  push:
    branches: [perf/ccn-pack-cohort-baseline, perf/ccn-pack-cohort-proof]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: ./scripts/test.sh -count=1 -run 'TestPackIndexPublishesCapturedCohort|TestPackIndexRejectsCapturedPackMutation|TestIndexedRepoRepairsPackArrival|TestIndexedRepoSeesLateAlternatePack' ./internal/gitobj
