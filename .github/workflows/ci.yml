name: Owned cache fixture final check

on:
  pull_request:
    branches: [review/query-libsystem-main151]

permissions:
  contents: read

concurrency:
  group: query-cache-owner-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cache-owner:
    if: github.head_ref == 'proof/query-cache-owner-check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: f7a3371d7d2318a591cc38a8b39df79c92e6f910
      - uses: ./.github/actions/setup
      - name: Large-store cache fixture and owned sidecars
        run: ./scripts/test.sh -race -count=1 -v -run '^TestFoldCacheHoldsTheLiveRefsOfALargeStore$' ./internal/store
