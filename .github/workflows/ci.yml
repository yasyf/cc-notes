name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bounded-cache-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install syscall tracer
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Fresh-process cache cost and crash contracts
        run: ./scripts/test.sh -count=1 -v -run '^(TestLRUDir|TestCacheReader)' ./internal/store

  task-dedupe-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install syscall accounting
        run: sudo apt-get update && sudo apt-get install -y strace && strace --version
      - name: Download the pinned legacy CLI baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ccn_legacy_dir="$RUNNER_TEMP/ccn-legacy-07418"
          mkdir -p "$ccn_legacy_dir"
          gh release download v0.74.18 --repo yasyf/cc-notes --pattern cc-notes_linux_amd64 --pattern SHA256SUMS.txt --dir "$ccn_legacy_dir"
          cd "$ccn_legacy_dir"
          printf '%s  %s\n' fce14f9ef1cb764b1ebaed0ccc17db323b972d39d1b26da3f6bd4b05290e76ae SHA256SUMS.txt | sha256sum --check --strict -
          sha256sum --check --ignore-missing SHA256SUMS.txt
          chmod +x cc-notes_linux_amd64
          ./cc-notes_linux_amd64 --version
          echo "CCN_LEGACY_BASELINE_CLI=$ccn_legacy_dir/cc-notes_linux_amd64" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and record both pinned release-style variants
        id: build_variants
        env:
          CCN_ROWS1024_SHA: 6fc61d483298811ac1489b8f5292f6b6123a10af
          CCN_ROWS4096_SHA: 935c627c1cdb0f95f1f9b6866751cc489ef0f3b4
        run: |
          git fetch --no-tags origin "$CCN_ROWS1024_SHA" "$CCN_ROWS4096_SHA"
          git diff --exit-code "$CCN_ROWS1024_SHA" "$CCN_ROWS4096_SHA" -- . ':!internal/store/cache_publication.go'
          for ccn_rows in 1024 4096; do
            if [ "$ccn_rows" = 1024 ]; then
              ccn_variant_sha="$CCN_ROWS1024_SHA"
              ccn_runtime_hash=fec3fd9849f4229ff031b1c6f36885237d7589191ccae1a163cbcf3d1b5b9b95
            else
              ccn_variant_sha="$CCN_ROWS4096_SHA"
              ccn_runtime_hash=9a1262ace7f743abad2b38e63e3699aaa8ae04be9d27ad592373c70fe41f7550
            fi
            ccn_variant_source="$RUNNER_TEMP/ccn-rows-$ccn_rows-source"
            ccn_variant_cli="$RUNNER_TEMP/ccn-rows-$ccn_rows"
            git worktree add --detach "$ccn_variant_source" "$ccn_variant_sha"
            test "$(git -C "$ccn_variant_source" rev-parse HEAD)" = "$ccn_variant_sha"
            printf '%s  %s\n' "$ccn_runtime_hash" "$ccn_variant_source/internal/store/cache_publication.go" | sha256sum --check --strict -
            printf '%s  %s\n' 209751b3801fef5227125790929e702b6242f238fbc8c2d8ffd17f67172a1fe7 "$ccn_variant_source/internal/store/cache_publication_test.go" | sha256sum --check --strict -
            printf '%s  %s\n' 2d7ebabebe9f9a6a57c763a5bbe1a63bfb975641ec3d3fc7cf979a4ebe214717 "$ccn_variant_source/internal/store/lrudir.go" | sha256sum --check --strict -
            printf '%s  %s\n' 5c41c174697f5c063c99e492905e6e6897fc1bd07e6459720cb17a0eb34a8ba4 "$ccn_variant_source/internal/store/lrudir_cost_test.go" | sha256sum --check --strict -
            printf '%s  %s\n' 7bedc5920926715920b17b73225a68f51e7d4e6e071d2fed9b067a783b09ca36 "$ccn_variant_source/internal/store/lrudir_missing_test.go" | sha256sum --check --strict -
            (
              cd "$ccn_variant_source/web"
              npm ci
              npm run build
            )
            ccn_perf_ldflags="-s -w -X github.com/yasyf/cc-notes/internal/version.Version=v0.74.19-perf-proof -X github.com/yasyf/cc-notes/internal/version.Commit=$ccn_variant_sha"
            (
              cd "$ccn_variant_source"
              CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags webui -ldflags "$ccn_perf_ldflags" -o "$ccn_variant_cli" ./cmd/cc-notes
            )
            printf 'rows=%s source=%s binary=%s\n' "$ccn_rows" "$ccn_variant_sha" "$ccn_variant_cli"
            go version -m "$ccn_variant_cli"
            sha256sum "$ccn_variant_cli"
            echo "CCN_ROWS${ccn_rows}_CLI=$ccn_variant_cli" >> "$GITHUB_ENV"
            echo "CCN_ROWS${ccn_rows}_SOURCE=$ccn_variant_source" >> "$GITHUB_ENV"
          done
          go version -m "$CCN_LEGACY_BASELINE_CLI"
          sha256sum "$CCN_LEGACY_BASELINE_CLI"
      - name: Rows 1024 original payload metadata and legacy comparison
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        env:
          CCN_PRODUCTIONLIKE_CLI: ${{ env.CCN_ROWS1024_CLI }}
        run: ./scripts/test.sh -count=1 -v -run '^(TestTaskDedupe(FreshCLI(Cost|MetadataCost)|LegacyCLIListCost)|TestTaskIOBytesTraceAccounting)$' ./internal/cli
      - name: Rows 4096 original payload metadata and legacy comparison
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        env:
          CCN_PRODUCTIONLIKE_CLI: ${{ env.CCN_ROWS4096_CLI }}
        run: ./scripts/test.sh -count=1 -v -run '^(TestTaskDedupe(FreshCLI(Cost|MetadataCost)|LegacyCLIListCost)|TestTaskIOBytesTraceAccounting)$' ./internal/cli
      - name: Rows 1024 separate cold returned-byte comparison
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        env:
          CCN_PRODUCTIONLIKE_CLI: ${{ env.CCN_ROWS1024_CLI }}
        run: ./scripts/test.sh -count=1 -v -run '^TestTaskDedupeColdCLIBytes$' ./internal/cli
      - name: Rows 1024 publication contracts and initialized flush duration
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        run: |
          cd "$CCN_ROWS1024_SOURCE"
          ./scripts/test.sh -count=1 -v -run '^(TestLRUDirMissing|TestLRUDirPublicationBatch|TestLRUDirProcessBatchCrashAndGC$|TestLRUDirCompetingPublicationBatches$|TestLRUDirProcessCrashPublication$|TestLRUDirProcessesShareCapacity$|TestLRUDirFoldAllPublishesTailAfterWait$|TestLRUDirQueryRefreshPublishesUnselectedTail$|TestLRUDirPointLoadAtStillPublishesImmediately$)' ./internal/store
      - name: Rows 4096 separate cold returned-byte comparison
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        env:
          CCN_PRODUCTIONLIKE_CLI: ${{ env.CCN_ROWS4096_CLI }}
        run: ./scripts/test.sh -count=1 -v -run '^TestTaskDedupeColdCLIBytes$' ./internal/cli
      - name: Rows 4096 publication contracts and initialized flush duration
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        run: |
          cd "$CCN_ROWS4096_SOURCE"
          ./scripts/test.sh -count=1 -v -run '^(TestLRUDirMissing|TestLRUDirPublicationBatch|TestLRUDirProcessBatchCrashAndGC$|TestLRUDirCompetingPublicationBatches$|TestLRUDirProcessCrashPublication$|TestLRUDirProcessesShareCapacity$|TestLRUDirFoldAllPublishesTailAfterWait$|TestLRUDirQueryRefreshPublishesUnselectedTail$|TestLRUDirPointLoadAtStillPublishesImmediately$)' ./internal/store
      - name: Query mutation work accounting
        if: ${{ !cancelled() && steps.build_variants.outcome == 'success' }}
        run: ./scripts/test.sh -count=1 -v -run '^(TestTaskQueryIndexConsecutiveWork|TestQueryMutationWorkContextCallsites)$' ./internal/store

  attachment-ref-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Attachment reference enumeration cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestReferencedAttachmentsPackedRefPasses$' ./internal/store

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: go vet
        run: go vet ./...

      - name: Test (race, via the process-cap harness)
        run: ./scripts/test.sh -race -count=1 ./...

      - name: Build (default, pure Go)
        run: go build ./...

      - name: Cross-compile smoke (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/cc-notes_linux_amd64 ./cmd/cc-notes

      - name: Cross-compile smoke (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cc-notes_darwin_arm64 ./cmd/cc-notes

  helper:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install FUSE-T headers
        run: brew install macos-fuse-t/cask/fuse-t
      - name: Build the dedicated signed-helper target
        run: CGO_ENABLED=1 go build -tags fuse ./cmd/cc-notes-helper
      # The home-discipline pins scan the host's file set, so every _darwin.go
      # file is invisible to the ubuntu test job.
      - name: Home-discipline contract over the darwin file set
        run: ./scripts/test.sh -race -count=1 ./internal/homeguard
      - name: Prove the ordinary CLI has no FuseKit child dispatcher
        run: |
          CGO_ENABLED=0 go build -o /tmp/cc-notes ./cmd/cc-notes
          strings -a /tmp/cc-notes > /tmp/cc-notes.strings
          if grep -E -- '--fusekit-(broker-child|catalog-worker-v1|daemon-socket|source-driver-v1|source-observer-child|source-task-child)' /tmp/cc-notes.strings; then
            echo "::error::ordinary cc-notes CLI still embeds a FuseKit child mode"
            exit 1
          fi

  # Static analysis type-checks the tree, so it runs for darwin. GOOS/GOARCH
  # keep it on a cheap linux runner instead of billing macOS minutes 10x.
  lint:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: govulncheck
        run: |
          GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hook-tests:
    runs-on: ubuntu-latest
    env:
      CAPT_HOOK_VERSION: "12.89.1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup

      - name: Build cc-notes binary onto PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/cc-notes" ./cmd/cc-notes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache NLP resources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: capt-hook-${{ env.CAPT_HOOK_VERSION }}-nlp-v5

      - name: Provision NLP resources (spaCy en_core_web_sm + oewn:2025 lexicon)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --with "capt-hook==$CAPT_HOOK_VERSION" python -c "from captain_hook.util.model_cache import ensure_nlp_resources; ensure_nlp_resources()"

      - name: capt-hook pack test
        run: uvx --isolated "capt-hook==$CAPT_HOOK_VERSION" pack test plugin

      - name: pack unit tests
        run: uv run plugin/capt-hook/hooks/tests/test_cc_notes.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  webui:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Verify embedded dist present
        run: test -f web/dist/index.html

      - name: go vet (webui)
        run: go vet -tags webui ./...

      - name: Build (webui)
        run: go build -tags webui ./...

      - name: Test web package (webui)
        run: go test -tags webui -timeout 300s -count=1 ./web
