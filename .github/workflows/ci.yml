name: Native Mac oracle proof

on:
  pull_request:
    branches: [fix/foreground-pack-index]

concurrency:
  group: native-oracle-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native-mac-oracles:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Native missing index and removed object database contracts
        run: ./scripts/test.sh -race -count=1 -v -run '^TestNative(MissingIndexReloadsOnceItsSymlinkTargetIsRestored|PathOIDMemoServesRepeatedAnchors)$' ./internal/gitobj
