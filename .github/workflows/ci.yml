name: Native APFS reference generation counters

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: query-native-counter-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-counters:
    if: github.head_ref == 'test/query-native-generation-counters'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./.github/actions/setup
      - name: Record native Git and Darwin identity
        run: |
          git --version
          sw_vers
          uname -m
      - name: Observe native counter support and 32 prepared ref transactions
        run: ./scripts/test.sh -race -count=1 -v -run '^TestNativeReferenceGenerationCounters$' ./internal/gitobj
