name: Native APFS reference stamp oracle

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: query-native-stamp-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-stamp:
    if: github.head_ref == 'test/query-native-stamp-precision'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Record native Git and Darwin identity
        run: |
          git --version
          sw_vers
          uname -m
      - name: Exercise 32 native ref transactions without changing authority guards
        run: ./scripts/test.sh -race -count=1 -v -run '^TestReferenceGenerationNativeStampPrecision$' ./internal/gitobj
