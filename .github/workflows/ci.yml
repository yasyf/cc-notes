name: Native libSystem final checks

on:
  pull_request:
    branches: [fix/query-counter-libsystem]

permissions:
  contents: read

concurrency:
  group: query-libsystem-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  lint-integration:
    if: github.head_ref == 'proof/query-libsystem-final-check'
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c4b4538c02cee640e4b981a7a1b373fef8e0abe
      - uses: ./.github/actions/setup
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Query and cold-duplicate integration
        env:
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(Reference|Query|Settled|CreateExactDuplicateAfterColdCache)' ./internal/gitobj ./internal/store

  native-bridge:
    if: github.head_ref == 'proof/query-libsystem-final-check'
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CCN_REQUIRE_NATIVE_REF_COUNTER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6c4b4538c02cee640e4b981a7a1b373fef8e0abe
      - uses: ./.github/actions/setup
      - name: Native bridge race and rapid writer authority
        run: CGO_ENABLED=1 ./scripts/test.sh -race -count=1 -v -run '^Test(Reference|Query|Settled|CreateExactDuplicateAfterColdCache)' ./internal/gitobj ./internal/store
      - name: Pure Go native bridge and rapid writer authority
        run: CGO_ENABLED=0 ./scripts/test.sh -count=1 -v -run '^Test(ReferenceCounter|ReferenceGenerationNative|QueryNativeGenerationRapidWork)' ./internal/gitobj ./internal/store
      - name: Darwin home discipline
        run: ./scripts/test.sh -race -count=1 ./internal/homeguard
      - name: Pure Go CLI architecture checks
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cc-notes ./cmd/cc-notes
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -o /tmp/cc-notes-amd64 ./cmd/cc-notes
          strings -a /tmp/cc-notes > /tmp/cc-notes.strings
          if grep -E -- '--fusekit-(broker-child|catalog-worker-v1|daemon-socket|source-driver-v1|source-observer-child|source-task-child)' /tmp/cc-notes.strings; then
            echo "::error::ordinary cc-notes CLI still embeds a FuseKit child mode"
            exit 1
          fi
