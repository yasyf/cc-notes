name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  bounded-cache-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install syscall tracer
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Fresh-process cache cost and crash contracts
        run: ./scripts/test.sh -count=1 -v -run '^(TestLRUDir|TestCacheReader|TestCacheHint|TestCacheInline)' ./internal/store
      - name: Exact-parent load semantics and native request cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestLoad(CachedParent|Parent)' ./internal/store
      - name: Reject full-history reads on the immutable public 33 baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-parent-load-negative"
          git fetch --no-tags --depth=1 origin baab49cc21ad40f8b2e9772237f3fb4008137254
          git worktree add --detach "$baseline" baab49cc21ad40f8b2e9772237f3fb4008137254
          cp internal/store/load_parent_cost_test.go "$baseline/internal/store/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestLoadParentFreshProcessCost$' ./internal/store) > "$RUNNER_TEMP/ccn-parent-load-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-parent-load-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-parent-load-negative.log")" -eq 4
          test "$(grep -c 'PARENT_LOAD_HISTORY_REGRESSION:' "$RUNNER_TEMP/ccn-parent-load-negative.log")" -eq 4
      - name: Reused fallback head semantics and native request cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestLoadFallback' ./internal/store
      - name: State-independent document edit semantics and logical read cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestDocEditSnapshotReadCost$' ./notes
      - name: Reject redundant document snapshot reads on the immutable public35 baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-doc-edit-negative"
          git fetch --no-tags --depth=1 origin 607fbd6fc53d1f46327de990e340de895c562c66
          git worktree add --detach "$baseline" 607fbd6fc53d1f46327de990e340de895c562c66
          cp notes/doc_edit_cost_linux_test.go "$baseline/notes/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestDocEditSnapshotReadCost$' ./notes) > "$RUNNER_TEMP/ccn-doc-edit-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-doc-edit-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-doc-edit-negative.log")" -eq 1
          test "$(grep -c 'DOC_EDIT_SNAPSHOT_READ_REGRESSION:' "$RUNNER_TEMP/ccn-doc-edit-negative.log")" -eq 1
      - name: Reject repeated large-head reads on the immutable public34 baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-fallback-head-negative"
          git fetch --no-tags --depth=1 origin 7268c6b97a7485874176e050ddbd9d2af5c1b423
          git worktree add --detach "$baseline" 7268c6b97a7485874176e050ddbd9d2af5c1b423
          cp internal/store/load_fallback_cost_test.go "$baseline/internal/store/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestLoadFallbackFreshProcessCost$' ./internal/store) > "$RUNNER_TEMP/ccn-fallback-head-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-fallback-head-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-fallback-head-negative.log")" -eq 4
          test "$(grep -c 'FALLBACK_HEAD_REREAD_REGRESSION:' "$RUNNER_TEMP/ccn-fallback-head-negative.log")" -eq 4
      - name: Exact duplicate contract with cold caches
        run: ./scripts/test.sh -race -count=1 -v -run '^TestCreateExactDuplicateAfterColdCache$' ./internal/store
      - name: Labeled ledger semantics and logical read cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestLedgerLabels' ./notes
      - name: Reject unrelated ledger payload reads on the immutable public35 baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-ledger-label-negative"
          git fetch --no-tags --depth=1 origin 607fbd6fc53d1f46327de990e340de895c562c66
          git worktree add --detach "$baseline" 607fbd6fc53d1f46327de990e340de895c562c66
          cp notes/ledger_labels_cost_linux_test.go "$baseline/notes/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestLedgerLabelsLogicalReadCost$' ./notes) > "$RUNNER_TEMP/ccn-ledger-label-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-ledger-label-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-ledger-label-negative.log")" -eq 1
          test "$(grep -c 'LEDGER_LABEL_CORPUS_READ_REGRESSION:' "$RUNNER_TEMP/ccn-ledger-label-negative.log")" -eq 1
      - name: Keyed duplicate content, survivors and held-index fallback
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(DuplicateFingerprint|IndexedDuplicate)' ./internal/store
      - name: Prior32 metadata and external writer duplicate authority
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-prior32-query-writer"
          git fetch --no-tags --depth=1 origin 505f85434de0540e539109678448f7dfdd23a3af
          git worktree add --detach "$baseline" 505f85434de0540e539109678448f7dfdd23a3af
          cp internal/store/dedupe_prior_writer_process_test.go "$baseline/internal/store/"
          (cd "$baseline" && go test -c -o "$RUNNER_TEMP/ccn-prior32-query-writer.test" ./internal/store)
          CCN_PRIOR_QUERY_WRITER="$RUNNER_TEMP/ccn-prior32-query-writer.test" \
            ./scripts/test.sh -race -count=1 -v -run '^TestIndexedDuplicatePriorSchemaAndWriter$' ./internal/store
      - name: Reject the public 147 regression baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-147-negative"
          git fetch --no-tags --depth=1 origin d7a2c445078f6da7d77fe5b9e6658096884d0146
          git worktree add --detach "$baseline" d7a2c445078f6da7d77fe5b9e6658096884d0146
          cp internal/store/dedupe_cold_contract_test.go "$baseline/internal/store/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestCreateExactDuplicateAfterColdCache$' ./internal/store) > "$RUNNER_TEMP/ccn-147-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-147-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'COLD_DUPLICATE_REGRESSION:' "$RUNNER_TEMP/ccn-147-negative.log")" -eq 6
      - name: Anchored doc complete DTO semantics and logical read cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestDocAnchors' ./notes
      - name: Reject unrelated doc body reads on the immutable accepted38 source
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-doc-anchor-negative"
          git fetch --no-tags --depth=1 origin 469d76e4d239e9cbc46f8d835377f73c2c057901
          git worktree add --detach "$baseline" 469d76e4d239e9cbc46f8d835377f73c2c057901
          cp notes/doc_anchors_cost_linux_test.go "$baseline/notes/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestDocAnchorsLogicalReadCost$' ./notes) > "$RUNNER_TEMP/ccn-doc-anchor-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-doc-anchor-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-doc-anchor-negative.log")" -eq 1
          test "$(grep -c 'DOC_ANCHOR_CORPUS_READ_REGRESSION:' "$RUNNER_TEMP/ccn-doc-anchor-negative.log")" -eq 1
      - name: Query metadata semantic generation contracts
        run: ./scripts/test.sh -race -count=1 -v -run '^TestQueryMetadata(ExecutableIndependentReuse|SemanticGenerationIsolation)$' ./internal/store
      - name: Labeled doc complete DTO semantics and logical read cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestDocLabels' ./notes
      - name: Reject unrelated doc body reads on the immutable public36 baseline
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-doc-label-negative"
          git fetch --no-tags --depth=1 origin 8ab2fd790221b2cf9469c6e844998529fd6bd3dd
          git worktree add --detach "$baseline" 8ab2fd790221b2cf9469c6e844998529fd6bd3dd
          cp notes/doc_labels_cost_linux_test.go "$baseline/notes/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestDocLabelsLogicalReadCost$' ./notes) > "$RUNNER_TEMP/ccn-doc-label-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-doc-label-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'full_snapshot=PASS' "$RUNNER_TEMP/ccn-doc-label-negative.log")" -eq 1
          test "$(grep -c 'DOC_LABEL_CORPUS_READ_REGRESSION:' "$RUNNER_TEMP/ccn-doc-label-negative.log")" -eq 1
      - name: Reject executable-bound metadata rebuilds
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-query-executable-negative"
          git fetch --no-tags --depth=1 origin f7a3371d7d2318a591cc38a8b39df79c92e6f910
          git worktree add --detach "$baseline" f7a3371d7d2318a591cc38a8b39df79c92e6f910
          cp internal/store/query_identity_test.go "$baseline/internal/store/"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestQueryMetadataExecutableIndependentReuse$' ./internal/store) > "$RUNNER_TEMP/ccn-query-executable-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-query-executable-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'EXECUTABLE_METADATA_REBUILD:' "$RUNNER_TEMP/ccn-query-executable-negative.log")" -eq 2

  release-monotonic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify standard release version ordering
        run: ./scripts/test.sh -race -count=1 ./scripts/release-version
      - name: Build the release version comparator
        run: go build -o "$RUNNER_TEMP/release-version" ./scripts/release-version
      - name: Verify real Git publication races and latest promotion policy
        run: |
          set -euo pipefail
          ruby -ryaml -rjson -e 'workflow = YAML.load_file(ARGV[0]); job = workflow.fetch("jobs").fetch("sync-plugin-version"); File.write(ARGV[1], job.fetch("steps").find { |step| step["name"] == "Sync plugin.json version to the released tag" }.fetch("run")); File.write(ARGV[2], JSON.generate(workflow))' \
            .github/workflows/release.yml "$RUNNER_TEMP/sync-plugin.sh" "$RUNNER_TEMP/release-workflow.json"
          SYNC_PLUGIN_SCRIPT="$RUNNER_TEMP/sync-plugin.sh" \
          RELEASE_WORKFLOW_JSON="$RUNNER_TEMP/release-workflow.json" \
          RELEASE_VERSION_COMPARE="$RUNNER_TEMP/release-version" \
            python3 scripts/test_release_monotonic.py


  task-dedupe-cost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install syscall accounting
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Fresh CLI task deduplication payload, metadata and full-list costs
        run: ./scripts/test.sh -count=1 -v -run '^TestTaskDedupeFreshCLI(Cost|MetadataCost)$' ./internal/cli
      - name: Selected-task JSON blocking cost
        run: ./scripts/test.sh -count=1 -v -run '^TestTaskBlockingFreshCLICost$' ./internal/cli
      - name: Selected-task reverse-posting work
        run: ./scripts/test.sh -count=1 -v -run '^TestQueryTaskBlockingBatchWork$' ./internal/store
      - name: Query metadata cardinality contracts and work
        run: ./scripts/test.sh -count=1 -v -run '^TestQueryMetadataCardinality' ./internal/store
      - name: Selected answer supersession contracts and fixed work
        run: ./scripts/test.sh -count=1 -v -run '^Test(Supersession|IndexedSupersession|AnswerShowFreshCLICost|Resolve|BoundStoreFailsAfterBackendReplaced|PackedReference|SortedPackedReference|UnsortedPackedReference|NativeReferences|NativeMultiplePrefixes|ReferencePrefix)' ./notes ./internal/store ./internal/cli ./internal/gitobj
      - name: Native packed read ownership and corpus contracts
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(Native|ObjectBatch)' ./internal/gitobj ./internal/gitcmd
      - name: Fresh CLI packed ledger read beside a legacy object-index writer
        if: ${{ !cancelled() }}
        run: ./scripts/test.sh -count=1 -v -run '^TestPackedObjectIndexFreshCLICost$' ./internal/cli

  attachment-ref-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Attachment reference enumeration cost
        run: ./scripts/test.sh -race -count=1 -v -run '^TestReferencedAttachmentsPackedRefPasses$' ./internal/store

  test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: go vet
        run: go vet ./...

      - name: Test (race, via the process-cap harness)
        run: ./scripts/test.sh -race -count=1 ./...

      - name: Build (default, pure Go)
        run: go build ./...

      - name: Cross-compile smoke (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/cc-notes_linux_amd64 ./cmd/cc-notes

      - name: Cross-compile smoke (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cc-notes_darwin_arm64 ./cmd/cc-notes

  helper:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install FUSE-T headers
        run: brew install macos-fuse-t/cask/fuse-t
      - name: Build the dedicated signed-helper target
        run: CGO_ENABLED=1 go build -tags fuse ./cmd/cc-notes-helper
      # The home-discipline pins scan the host's file set, so every _darwin.go
      # file is invisible to the ubuntu test job.
      - name: Home-discipline contract over the darwin file set
        run: ./scripts/test.sh -race -count=1 ./internal/homeguard
      - name: Native reference generations and rapid query authority
        env:
          CCN_REQUIRE_NATIVE_REF_COUNTER: "1"
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(Reference|Query|Settled)' ./internal/gitobj ./internal/store
      - name: Native answer corpus snapshots and payload costs
        run: ./scripts/test.sh -race -count=1 -v -run '^TestAnswerCorpus' ./internal/store ./notes
      - name: Reject whole-list duplicate discovery on a current index
        env:
          CCN_REQUIRE_NATIVE_REF_COUNTER: "1"
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ccn-duplicate-list-negative"
          git fetch --no-tags --depth=1 origin 829c70ebde41858cf3e55347c94fcee7e4e9e54c
          git worktree add --detach "$baseline" HEAD
          git show 829c70ebde41858cf3e55347c94fcee7e4e9e54c:internal/store/dedupe.go > "$baseline/internal/store/dedupe.go"
          set +e
          (cd "$baseline" && ./scripts/test.sh -count=1 -v -run '^TestQueryDuplicateSelectedWork$' ./internal/store) > "$RUNNER_TEMP/ccn-duplicate-list-negative.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/ccn-duplicate-list-negative.log"
          test "$result" -ne 0
          test "$(grep -c 'KEYED_DUPLICATE_WORK:' "$RUNNER_TEMP/ccn-duplicate-list-negative.log")" -eq 2
      - name: Prove the ordinary CLI has no FuseKit child dispatcher
        run: |
          CGO_ENABLED=0 go build -o /tmp/cc-notes ./cmd/cc-notes
          strings -a /tmp/cc-notes > /tmp/cc-notes.strings
          if grep -E -- '--fusekit-(broker-child|catalog-worker-v1|daemon-socket|source-driver-v1|source-observer-child|source-task-child)' /tmp/cc-notes.strings; then
            echo "::error::ordinary cc-notes CLI still embeds a FuseKit child mode"
            exit 1
          fi

  # Static analysis type-checks the tree, so it runs for darwin. GOOS/GOARCH
  # keep it on a cheap linux runner instead of billing macOS minutes 10x.
  lint:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  vuln:
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: govulncheck
        run: |
          GOOS= GOARCH= go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  hook-tests:
    runs-on: ubuntu-latest
    env:
      CAPT_HOOK_VERSION: "12.89.1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - uses: ./.github/actions/setup

      - name: Build cc-notes binary onto PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -o "$HOME/.local/bin/cc-notes" ./cmd/cc-notes
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache NLP resources
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/spacy/models
            ~/.wn_data
          key: capt-hook-${{ env.CAPT_HOOK_VERSION }}-nlp-v5

      - name: Provision NLP resources (spaCy en_core_web_sm + oewn:2025 lexicon)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run --no-project --with "capt-hook==$CAPT_HOOK_VERSION" python -c "from captain_hook.util.model_cache import ensure_nlp_resources; ensure_nlp_resources()"

      - name: capt-hook pack test
        run: uvx --isolated "capt-hook==$CAPT_HOOK_VERSION" pack test plugin

      - name: pack unit tests
        run: uv run plugin/capt-hook/hooks/tests/test_cc_notes.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  webui:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Verify embedded dist present
        run: test -f web/dist/index.html

      - name: go vet (webui)
        run: go vet -tags webui ./...

      - name: Build (webui)
        run: go build -tags webui ./...

      - name: Test web package (webui)
        run: go test -tags webui -timeout 300s -count=1 ./web
