name: Native generation final lint and integration

on:
  pull_request:
    branches: [review/query-common-main]

permissions:
  contents: read

concurrency:
  group: query-common-final-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  final-check:
    if: github.head_ref == 'proof/query-common-final-check'
    runs-on: ubuntu-latest
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1400d2fde1aa7dc94356beca4eb596de60d2be1a
      - uses: ./.github/actions/setup
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Query and cold-duplicate integration
        env:
          GOOS: linux
          GOARCH: amd64
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(Reference|Query|Settled|CreateExactDuplicateAfterColdCache)' ./internal/gitobj ./internal/store
