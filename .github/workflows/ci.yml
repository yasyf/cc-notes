name: Dense cache cold fixture oracle

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dense-cold-fixture-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cold-fixture:
    if: github.head_ref == 'test/dense-append-cold-fixture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Verify cold fixture and append contracts
        run: ./scripts/test.sh -race -count=1 -v -run '^Test(WipeCacheDropsOpenInlineEntry|Append)' ./internal/store
